<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Zoo Director 应用图标</title>
  <desc>深青色底板上，三个暖金色节点与连线组成简约冠形，象征统一管理分布式节点。</desc>
  <!-- 纯色圆角底板与透明边距保持原生应用图标的视觉比例。 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#163F43"/>
  <!-- 三个端点汇合为冠形，兼顾节点拓扑与 Director 的管理寓意。 -->
  <path d="M304 396L376 672H648L720 396M512 328V672" stroke="#F2CA72" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="248" y="340" width="112" height="112" rx="32" fill="#F2CA72"/>
  <rect x="456" y="272" width="112" height="112" rx="32" fill="#F2CA72"/>
  <rect x="664" y="340" width="112" height="112" rx="32" fill="#F2CA72"/>
  <!-- 短底线让标志在小尺寸下仍呈现稳定、完整的轮廓。 -->
  <path d="M408 752H616" stroke="#F2CA72" stroke-width="48" stroke-linecap="round"/>
</svg>
