name: Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.0.0 (uploads to a draft if no release exists)
        required: true
        type: string

# 构建任务只读代码，只有两个包都成功后的上传任务拥有发行版写入权限。
permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Validate tag and inspect release
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      DISTRIBUTION_CHANNEL: github
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Check toolchain and native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
      - name: Test
        run: |
          python3 -m unittest discover -s scripts/tests -v
          swift test --disable-sandbox
      - name: Import signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python3 scripts/ci-signing.py setup
      - name: Build, sign, notarize and package
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: ./scripts/release-app.sh "$RELEASE_ARCH"
      - name: Save DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/ZooDirector-${{ env.APP_VERSION }}-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always()
        run: python3 scripts/ci-signing.py cleanup

  upload:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Upload both DMGs to the release
        shell: bash
        run: |
          set -euo pipefail
          files=("dist/ZooDirector-$APP_VERSION-arm64.dmg" "dist/ZooDirector-$APP_VERSION-x86_64.dmg")
          for file in "${files[@]}"; do test -s "$file"; done
          # 手动触发且发行版不存在时先创建草稿，供用户审阅后发布。
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
